[package]
name = "mailtui"
version = "0.4.1"
edition = "2024"
rust-version = "1.89"
description = "Local-first, keyboard-driven mail explorer"
license = "MIT"

[dependencies]
anyhow = "1"
ammonia = "4"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
chrono = "0.4"
chrono-tz = "0.10"
futures-util = "0.3"
html2text = "0.16"
io-pimdir = { git = "https://github.com/pimalaya/io-pimdir", rev = "3b4bed845a291d848499b3288952bd6a663fd513" }
mail-parser = "0.11"
mail-builder = "1"
notify = "8"
rand = "0.9"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rrule = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "1"
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
insta = "1"

[profile.release]
lto = "thin"
strip = true
